<html lang="en">

<head>

    <title>To-Do List</title>

<body>

    <div class="main">
        <div class="dashboard">
            <div class="log">
                <img src="./list.png" alt="">
                <h3>Todo List</h3>

            </div>


            <div class="all-task">
                <img src="./home.png" alt="">
                <p>All Tasks</p>
                <div class="task-count">
                    <p>5</p>
                </div>
            </div>

            <div class="all-task">
                <img src="./check-mark.png" alt="">
                <p>Completed</p>
                <div class="task-count">
                    <p>2</p>
                </div>
            </div>

            <div class="all-task">
                <img src="./chevron.png" alt="">
                <p>Upcoming</p>
                <div class="task-count">
                    <p>6</p>
                </div>
            </div>

            <div class="all-task">
                <img src="./star.png" alt="">
                <p>Important</p>
                <div class="task-count">
                    <p>1</p>
                </div>
            </div>

            <div class="all-task">
                <img src="./bin.png" alt="">
                <p>Delete</p>
            </div>
            <div class="line">
            </div>
            <div class="motivation">
                <img src="./motivation.jpg" alt="">

            </div>
        </div>
        <div class="sidebar-nav">
            <div class="user">
                <div class="user-info">
                    <h1>Hello Ankit!</h1>
                    <p>Let's complete your tasks today.</p>
                </div>
                <div class="date">
                    <div class="date-img">
                        <img src="./date.png" alt="">
                    </div>
                    <div class="live-date">
                        <div id="currantDate">Thursdayk 26 November 2026</div>
                    </div>
                </div>

            </div>
            <div class="input-task-bar">
                <span class="plus">+</span>
                <input type="text" class="task-input" id="taskinput" placeholder="Add a new task...">
                <button type="button" class="add-btn">
                    <svg class="send-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        <span>Add</span>
                    </svg>
                </button>
            </div>
            <div class="nave-bar">
                <div class="all">
                    <h2>All(5)</h2>
                </div>

                <div class="today">
                    <img src="./date.png" alt="">
                    <h2>Today(3)</h2>
                </div>

                <div class="important">
                    <h2>Important(2) </h2>
                </div>

                <div class="completed">
                    <h2>Completed</h2>

                </div>

                <div class="filter-section">
                    <div class="verticle-line"></div>



                    <div class="task-fillter">
                        <select class="fillter-category">
                            <option value="All">All Tasks</option>
                            <option value="Important">Important</option>
                            <option value="Work">Work</option>
                            <option value="Study">Study</option>
                            <option value="Project">Project</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>




            </div>
